<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7A6B"/>
      <stop offset="0.55" stop-color="#FF3B30"/>
      <stop offset="1" stop-color="#D92A20"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.5" cy="-0.15" r="0.95">
      <stop offset="0" stop-color="#fff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#7A1512" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#gloss)"/>

  <!-- hojas -->

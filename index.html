<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>PomoMomo</title>
<meta name="description" content="Gestión de portafolios, proyectos y actividades con matriz de Eisenhower, Kanban, burndown y temporizador Pomodoro.">

<!-- PWA -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#F2F2F7">
<meta name="color-scheme" content="light">

<!-- iOS: pantalla de inicio -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PomoMomo">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">

<!-- Estilos -->
<link rel="stylesheet" href="./css/app.css">
</head>
<body>

  <div id="app">
    <div class="signin">
      <div class="col center g-16">
        <div class="signin-mark">🍅</div>
        <div class="t-sub">Cargando…</div>
      </div>
    </div>
  </div>

  <!-- Capa de hojas modales -->
  <div class="scrim" id="scrim"></div>

  <!-- Notificaciones flotantes -->
  <div class="toasts" id="toasts"></div>

  <noscript>
    <div style="padding:40px;text-align:center;font-family:system-ui">
      <h1>PomoMomo</h1>
      <p>Esta aplicación necesita JavaScript activado.</p>
    </div>
  </noscript>

  <!-- La versión en la URL garantiza que una publicación nueva no reutilice
       el módulo anterior guardado en la caché del navegador. -->
  <script type="module" src="./js/app.js?v=2.9.0"></script>
</body>
</html>
